plugins { id 'com.android.application' }
android {
    namespace 'id.soundstickermaker'
    compileSdk 35
    defaultConfig {
        applicationId 'id.soundstickermaker'
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName '0.4.2-experimental'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
tasks.register('checkEngine') {
    doLast {
        ['logger','convert','wa','ui','main'].each { n ->
            if (!file("src/main/assets/engine/${n}.js").exists()) {
                throw new GradleException('Engine missing. Run tools/fetch_engine.py first.')
            }
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'checkEngine' }

// Native video normalization before WebView attempts playback.
dependencies {
    implementation 'androidx.media3:media3-transformer:1.5.1'
    implementation 'androidx.media3:media3-effect:1.5.1'
    implementation 'androidx.core:core:1.13.1'
}
